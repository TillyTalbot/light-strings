<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Light Strings — hand-tracked instrument</title>
<style>
  :root { --ink:#f4f1ea; --dim:rgba(244,241,234,.6); }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; background:#000; overflow:hidden;
    font-family: ui-sans-serif, -apple-system, "Helvetica Neue", Arial, sans-serif; color:var(--ink); }
  canvas { position:fixed; inset:0; width:100vw; height:100vh; display:block; }
  video { display:none; }

  #start { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:22px; background:radial-gradient(ellipse at center, #141414 0%, #000 70%); z-index:10; text-align:center; padding:24px; }
  #start h1 { font-weight:300; letter-spacing:.32em; text-transform:uppercase; font-size:clamp(22px,4vw,40px); }
  #start p { color:var(--dim); max-width:520px; line-height:1.6; font-size:15px; }
  button { font:inherit; color:var(--ink); background:transparent; border:1px solid rgba(244,241,234,.35);
    padding:10px 18px; border-radius:999px; cursor:pointer; letter-spacing:.08em; font-size:13px; }
  button:hover { border-color:var(--ink); background:rgba(255,255,255,.06); }
  button.on { background:rgba(255,255,255,.14); border-color:var(--ink); }
  #go { font-size:15px; padding:14px 30px; letter-spacing:.2em; text-transform:uppercase; }
  #status { color:var(--dim); font-size:13px; min-height:1.2em; }

  #bar { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); display:flex; gap:8px; z-index:5;
    background:rgba(0,0,0,.35); backdrop-filter:blur(8px); padding:8px; border-radius:999px; opacity:.85; }
  #bar button { padding:8px 14px; font-size:12px; }
  #rec.live { border-color:#ff4d5e; color:#ff8d98; }
  #hint { position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:5; font-size:13px; color:var(--dim);
    background:rgba(0,0,0,.35); backdrop-filter:blur(8px); padding:8px 16px; border-radius:999px; transition:opacity 1s; white-space:nowrap; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<video id="video" playsinline muted></video>
<canvas id="c"></canvas>

<div id="start">
  <h1>Light Strings</h1>
  <p>Pinch your thumb and index finger and pull to stretch a string of light.
     Pinch with both hands to stretch one between them. Let go and it stays hanging in the air.
     Swipe a finger through a string to pluck it.</p>
  <button id="go">Start camera</button>
  <div id="status"></div>
</div>

<div id="hint" class="hidden">Pinch &amp; pull to make a string · swipe a fingertip through it to pluck</div>
<div id="bar" class="hidden">
  <button id="bSkel" class="on" title="H">Skeleton</button>
  <button id="bSound" class="on" title="M">Sound</button>
  <button id="bClear" title="C">Clear</button>
  <button id="rec" title="R">● Record</button>
</div>

<script type="module">
import { FilesetResolver, HandLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

/* ---------------- settings you can play with ---------------- */
const SETTINGS = {
  pinchOn: 0.30,          // thumb–index distance (relative to hand size) that counts as a pinch
  pinchOff: 0.42,         // distance at which the pinch lets go (a gap here stops flicker)
  maxStrings: 14,         // older strings fade out after this many
  minLength: 50,          // px: shorter strings are thrown away
  wobbleSpeed: 34,        // how fast the string visibly vibrates
  decay: 2.2,             // how quickly a plucked string settles
  darken: 0.30,           // how much the camera image is dimmed so the light pops
  palette: [190, 320, 95, 45, 265, 160],   // hues used for plucks (cyan, pink, lime, gold, violet, mint)
  scale: [0, 2, 4, 7, 9], // pentatonic: every note sounds good together
  lowNote: 48, highNote: 84 // MIDI range (C3 – C6)
};

/* ---------------- setup ---------------- */
const video = document.getElementById('video');
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener('resize', resize); resize();

let landmarker = null;
let showSkeleton = true, soundOn = true;

document.getElementById('go').onclick = async () => {
  try {
    initAudio();
    statusEl.textContent = 'Asking for the camera…';
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720, facingMode: 'user' }, audio: false });
    video.srcObject = stream; await video.play();
    statusEl.textContent = 'Loading the hand-tracking model…';
    const files = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    const opts = (delegate) => ({
      baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task", delegate },
      runningMode: "VIDEO", numHands: 2,
      minHandDetectionConfidence: 0.5, minHandPresenceConfidence: 0.5, minTrackingConfidence: 0.5
    });
    try { landmarker = await HandLandmarker.createFromOptions(files, opts("GPU")); }
    catch { landmarker = await HandLandmarker.createFromOptions(files, opts("CPU")); }
    document.getElementById('start').classList.add('hidden');
    document.getElementById('bar').classList.remove('hidden');
    const hint = document.getElementById('hint'); hint.classList.remove('hidden');
    setTimeout(() => hint.style.opacity = 0, 9000);
    requestAnimationFrame(loop);
  } catch (e) {
    console.error(e);
    statusEl.textContent = 'Could not start: ' + (e.message || e) + '. Allow camera access and open the file in Chrome.';
  }
};

/* ---------------- sound: plucked strings (Karplus–Strong) + reverb ---------------- */
let actx, master, recordDest;
const bufCache = new Map();
function initAudio() {
  if (actx) return;
  actx = new (window.AudioContext || window.webkitAudioContext)();
  master = actx.createGain(); master.gain.value = 0.8;
  const comp = actx.createDynamicsCompressor();
  const verb = actx.createConvolver(); verb.buffer = makeImpulse(3.2);
  const wet = actx.createGain(); wet.gain.value = 0.38;
  master.connect(comp); master.connect(verb); verb.connect(wet); wet.connect(comp);
  comp.connect(actx.destination);
  recordDest = actx.createMediaStreamDestination(); comp.connect(recordDest);
}
function makeImpulse(sec) {
  const len = actx.sampleRate * sec, b = actx.createBuffer(2, len, actx.sampleRate);
  for (let ch = 0; ch < 2; ch++) { const d = b.getChannelData(ch);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
  return b;
}
function pluckBuffer(freq) {
  const key = Math.round(freq * 10);
  if (bufCache.has(key)) return bufCache.get(key);
  const sr = actx.sampleRate, len = Math.floor(sr * 2.4), N = Math.max(2, Math.round(sr / freq));
  const b = actx.createBuffer(1, len, sr), d = b.getChannelData(0);
  const ring = new Float32Array(N); let last = 0;
  for (let i = 0; i < N; i++) { last = last * 0.55 + (Math.random() * 2 - 1) * 0.45; ring[i] = last; } // softened noise = warmer tone
  for (let i = 0; i < len; i++) {
    const j = i % N, k = (i + 1) % N;
    d[i] = ring[j];
    ring[j] = 0.4985 * (ring[j] + ring[k]);
  }
  bufCache.set(key, b); return b;
}
function playNote(freq, strength, x) {
  if (!soundOn || !actx) return;
  const src = actx.createBufferSource(); src.buffer = pluckBuffer(freq);
  const g = actx.createGain(); g.gain.value = 0.25 + 0.6 * strength;
  const pan = actx.createStereoPanner(); pan.pan.value = Math.max(-1, Math.min(1, (x / W) * 2 - 1)) * 0.8;
  src.connect(g); g.connect(pan); pan.connect(master); src.start();
}
function noteForLength(len) {
  // longer string = lower note, like a real instrument; snapped to the pentatonic scale
  const notes = [];
  for (let m = SETTINGS.lowNote; m <= SETTINGS.highNote; m++) if (SETTINGS.scale.includes(m % 12)) notes.push(m);
  const diag = Math.hypot(W, H);
  const t = 1 - Math.min(1, len / (diag * 0.7));
  const midi = notes[Math.round(t * (notes.length - 1))];
  return 440 * Math.pow(2, (midi - 69) / 12);
}

/* ---------------- geometry ---------------- */
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function segIntersect(p1, p2, q1, q2) {
  const r = { x: p2.x - p1.x, y: p2.y - p1.y }, s = { x: q2.x - q1.x, y: q2.y - q1.y };
  const den = r.x * s.y - r.y * s.x; if (Math.abs(den) < 1e-6) return null;
  const qp = { x: q1.x - p1.x, y: q1.y - p1.y };
  const t = (qp.x * s.y - qp.y * s.x) / den, u = (qp.x * r.y - qp.y * r.x) / den;
  return (t >= 0 && t <= 1 && u >= 0 && u <= 1) ? { t, u } : null;
}

/* ---------------- strings & sparks ---------------- */
let strings = [];
let sparks = [];
function makeString(a, b, live = false) {
  return { a: { ...a }, b: { ...b }, amp: 0, hue: 200, flash: 0, sat: 0, live, born: performance.now(), dying: 0, cool: {} };
}
function pluck(s, u, speed, at, now) {
  const strength = Math.min(1, speed / 2200);
  s.amp = Math.min(30, 7 + strength * 26);
  s.hue = SETTINGS.palette[Math.floor(Math.random() * SETTINGS.palette.length)];
  s.flash = 1; s.sat = 1; s.t0 = now; s.pu = u;
  playNote(noteForLength(dist(s.a, s.b)), strength, at.x);
  const nx = -(s.b.y - s.a.y), ny = s.b.x - s.a.x, nl = Math.hypot(nx, ny) || 1;
  for (let i = 0; i < 26 + strength * 30; i++) {
    const side = Math.random() < 0.5 ? -1 : 1, sp = 60 + Math.random() * 380 * (0.4 + strength);
    const ang = (Math.random() - 0.5) * 2.2;
    const dx = (nx / nl) * side, dy = (ny / nl) * side;
    const vx = dx * Math.cos(ang) - dy * Math.sin(ang), vy = dx * Math.sin(ang) + dy * Math.cos(ang);
    sparks.push({ x: at.x, y: at.y, vx: vx * sp, vy: vy * sp, life: 0.35 + Math.random() * 0.7, age: 0, hue: s.hue });
  }
}
function stringPoints(s, now) {
  const N = 48, pts = [];
  const dx = s.b.x - s.a.x, dy = s.b.y - s.a.y, L = Math.hypot(dx, dy) || 1;
  const nx = -dy / L, ny = dx / L;
  const t = (now - (s.t0 || 0)) / 1000, w = SETTINGS.wobbleSpeed;
  for (let i = 0; i <= N; i++) {
    const u = i / N;
    let off = 0;
    if (s.amp > 0.05) {
      off = s.amp * (Math.sin(Math.PI * u) * Math.sin(w * t)
          + 0.35 * Math.sin(2 * Math.PI * u) * Math.sin(2 * w * t + 0.7)
          + 0.15 * Math.sin(3 * Math.PI * u) * Math.sin(3 * w * t + 1.9));
    }
    if (s.live) off += Math.sin(u * 40 + now / 60) * 0.6 * Math.sin(Math.PI * u); // faint shimmer while held
    pts.push({ x: s.a.x + dx * u + nx * off, y: s.a.y + dy * u + ny * off });
  }
  return { pts, nx, ny };
}
function drawString(s, now) {
  const { pts, nx, ny } = stringPoints(s, now);
  const energy = Math.min(1, s.amp / 22 + s.flash * 0.6 + (s.live ? 0.35 : 0));
  const fade = s.dying ? Math.max(0, 1 - s.dying) : 1;
  const age = (now - s.born) / 1000, grow = Math.min(1, age * 4);
  const col = (a, l = 65) => `hsla(${s.hue}, ${Math.round(100 * s.sat)}%, ${l}%, ${a * fade * grow})`;
  const path = () => { ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y); };
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  // layered glow: wide & faint → thin & bright
  const passes = [[18, 0.05], [9, 0.10], [4, 0.28], [2, 0.6]];
  for (const [w, a] of passes) { path(); ctx.lineWidth = w; ctx.strokeStyle = col(a * (0.25 + 0.95 * energy)); ctx.stroke(); }
  path(); ctx.lineWidth = 1.1; ctx.strokeStyle = `rgba(255,255,255,${(0.75 + 0.25 * energy) * fade * grow})`; ctx.stroke();
  // little tick marks at each end (like the reference)
  ctx.lineWidth = 1.2; ctx.strokeStyle = `rgba(255,255,255,${0.85 * fade * grow})`;
  for (const p of [s.a, s.b]) { ctx.beginPath(); ctx.moveTo(p.x - nx * 7, p.y - ny * 7); ctx.lineTo(p.x + nx * 7, p.y + ny * 7); ctx.stroke(); }
  // occasional sparkle while held
  if (s.live && Math.random() < 0.5) {
    const p = pts[Math.floor(Math.random() * pts.length)];
    sparks.push({ x: p.x, y: p.y, vx: (Math.random() - 0.5) * 60, vy: (Math.random() - 0.5) * 60 + 20, life: 0.5, age: 0, hue: s.hue });
  }
}
function drawSparks(dt) {
  ctx.lineCap = 'round';
  sparks = sparks.filter(p => (p.age += dt) < p.life);
  for (const p of sparks) {
    p.vx *= 0.96; p.vy = p.vy * 0.96 + 120 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    const k = 1 - p.age / p.life;
    ctx.strokeStyle = `hsla(${p.hue}, 100%, ${70 + 25 * k}%, ${k})`; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.025, p.y - p.vy * 0.025); ctx.stroke();
  }
}

/* ---------------- hands ---------------- */
const CONNECTIONS = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
const hands = {};          // per hand: pinching, pinch point, anchor
const prevTips = {};       // fingertip positions from the last frame, for plucking
let liveString = null;
let lastVideoTime = -1, lastResult = null;

function mapPoint(lm, view) {
  return { x: W - (lm.x * view.vw * view.s + view.ox), y: lm.y * view.vh * view.s + view.oy };
}
function videoView() {
  const vw = video.videoWidth, vh = video.videoHeight, s = Math.max(W / vw, H / vh);
  return { vw, vh, s, ox: (W - vw * s) / 2, oy: (H - vh * s) / 2 };
}

function processHands(result, view, now, dt) {
  const seen = new Set();
  const found = [];
  (result?.landmarks || []).forEach((lms, i) => {
    const label = (result.handednesses?.[i]?.[0]?.categoryName || 'H') + (found.some(f => f.label.startsWith(result.handednesses?.[i]?.[0]?.categoryName)) ? i : '');
    const pts = lms.map(l => mapPoint(l, view));
    found.push({ label, pts });
  });

  for (const { label, pts } of found) {
    seen.add(label);
    const h = hands[label] || (hands[label] = { pinching: false, p: null, anchor: null });
    const size = dist(pts[0], pts[9]) || 1;
    const ratio = dist(pts[4], pts[8]) / size;
    const wasPinching = h.pinching;
    if (!h.pinching && ratio < SETTINGS.pinchOn) h.pinching = true;
    else if (h.pinching && ratio > SETTINGS.pinchOff) h.pinching = false;
    const mid = { x: (pts[4].x + pts[8].x) / 2, y: (pts[4].y + pts[8].y) / 2 };
    h.p = h.p ? { x: lerp(h.p.x, mid.x, 0.55), y: lerp(h.p.y, mid.y, 0.55) } : mid;
    if (h.pinching && !wasPinching) h.anchor = { ...h.p };
    h.pts = pts;

    // plucking: fingertips of this hand that aren't busy pinching
    const tips = h.pinching ? [12, 16, 20] : [8, 12, 16, 20];
    for (const tip of tips) {
      const key = label + '-' + tip, cur = pts[tip], prev = prevTips[key];
      if (prev && dist(prev, cur) < W * 0.35) {
        const speed = dist(prev, cur) / Math.max(dt, 1 / 120);
        for (const s of strings) {
          if (s.dying) continue;
          const hit = segIntersect(s.a, s.b, prev, cur);
          if (hit && hit.t > 0.06 && hit.t < 0.94 && now - (s.cool[key] || 0) > 160) {
            s.cool[key] = now;
            pluck(s, hit.t, speed, { x: lerp(s.a.x, s.b.x, hit.t), y: lerp(s.a.y, s.b.y, hit.t) }, now);
          }
        }
      }
      prevTips[key] = { ...cur };
    }
  }
  for (const k of Object.keys(hands)) if (!seen.has(k)) { if (hands[k].pinching) hands[k].pinching = false; hands[k].lost = true; }
  for (const k of Object.keys(prevTips)) if (!seen.has(k.split('-')[0])) delete prevTips[k];

  // build the string being held right now
  const pinchers = found.map(f => hands[f.label]).filter(h => h.pinching);
  let target = null;
  if (pinchers.length >= 2) target = [pinchers[0].p, pinchers[1].p];
  else if (pinchers.length === 1 && pinchers[0].anchor) target = [pinchers[0].anchor, pinchers[0].p];

  if (target) {
    if (!liveString) { liveString = makeString(target[0], target[1], true); liveString.hue = SETTINGS.palette[strings.length % SETTINGS.palette.length]; liveString.sat = 0.8; }
    liveString.a = { ...target[0] }; liveString.b = { ...target[1] };
    if (pinchers.length >= 2) for (const h of pinchers) h.anchor = { ...h.p }; // so letting go of one hand doesn't jump
  } else if (liveString) {
    // released: leave it hanging in the air with a little twang
    if (dist(liveString.a, liveString.b) > SETTINGS.minLength) {
      liveString.live = false; liveString.amp = 10; liveString.t0 = now; liveString.flash = 0.8;
      playNote(noteForLength(dist(liveString.a, liveString.b)), 0.25, (liveString.a.x + liveString.b.x) / 2);
      strings.push(liveString);
      const alive = strings.filter(s => !s.dying);
      if (alive.length > SETTINGS.maxStrings) alive[0].dying = 0.001;
    }
    liveString = null;
  }
}

function drawSkeleton() {
  for (const h of Object.values(hands)) {
    if (h.lost || !h.pts) continue;
    const p = h.pts;
    ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(40,220,90,.9)';
    for (const [a, b] of CONNECTIONS) { ctx.beginPath(); ctx.moveTo(p[a].x, p[a].y); ctx.lineTo(p[b].x, p[b].y); ctx.stroke(); }
    ctx.fillStyle = 'rgba(230,30,40,.95)';
    for (const q of p) { ctx.beginPath(); ctx.arc(q.x, q.y, 3.2, 0, Math.PI * 2); ctx.fill(); }
    if (h.pinching) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(h.p.x, h.p.y, 7, 0, Math.PI * 2); ctx.stroke(); }
  }
}

/* ---------------- main loop ---------------- */
let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  const view = videoView();

  if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    lastResult = landmarker.detectForVideo(video, now);
    for (const h of Object.values(hands)) h.lost = false;
    processHands(lastResult, view, now, dt);
  }

  // camera image, mirrored and dimmed
  ctx.globalCompositeOperation = 'source-over';
  ctx.save(); ctx.translate(W, 0); ctx.scale(-1, 1);
  ctx.drawImage(video, view.ox, view.oy, view.vw * view.s, view.vh * view.s);
  ctx.restore();
  ctx.fillStyle = `rgba(0,0,0,${SETTINGS.darken})`; ctx.fillRect(0, 0, W, H);

  if (showSkeleton) drawSkeleton();

  // light, added on top so overlapping glows brighten
  ctx.globalCompositeOperation = 'lighter';
  for (const s of strings) {
    s.amp *= Math.exp(-SETTINGS.decay * dt);
    s.flash *= Math.exp(-2.5 * dt);
    s.sat = Math.max(0, s.sat - dt * 0.5);
    if (s.dying) s.dying += dt * 1.5;
    drawString(s, now);
  }
  strings = strings.filter(s => !s.dying || s.dying < 1);
  if (liveString) drawString(liveString, now);
  drawSparks(dt);
  ctx.globalCompositeOperation = 'source-over';

  requestAnimationFrame(loop);
}

/* ---------------- controls ---------------- */
const bSkel = document.getElementById('bSkel'), bSound = document.getElementById('bSound');
const toggleSkel = () => { showSkeleton = !showSkeleton; bSkel.classList.toggle('on', showSkeleton); };
const toggleSound = () => { soundOn = !soundOn; bSound.classList.toggle('on', soundOn); };
const clearAll = () => { strings.forEach(s => s.dying = s.dying || 0.001); };
bSkel.onclick = toggleSkel; bSound.onclick = toggleSound; document.getElementById('bClear').onclick = clearAll;

// recording: saves a .webm video (with sound) of the canvas
let recorder = null, chunks = [];
const recBtn = document.getElementById('rec');
function toggleRec() {
  if (recorder) { recorder.stop(); return; }
  const stream = canvas.captureStream(30);
  if (recordDest) recordDest.stream.getAudioTracks().forEach(t => stream.addTrack(t));
  const type = ['video/webm;codecs=vp9,opus', 'video/webm', 'video/mp4'].find(t => MediaRecorder.isTypeSupported(t));
  recorder = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: 8e6 });
  chunks = [];
  recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
  recorder.onstop = () => {
    const blob = new Blob(chunks, { type: recorder.mimeType });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'light-strings-' + Date.now() + (type.includes('mp4') ? '.mp4' : '.webm'); a.click();
    recorder = null; recBtn.classList.remove('live'); recBtn.textContent = '● Record';
  };
  recorder.start(); recBtn.classList.add('live'); recBtn.textContent = '■ Stop';
}
recBtn.onclick = toggleRec;
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'h') toggleSkel(); else if (k === 'm') toggleSound(); else if (k === 'c') clearAll(); else if (k === 'r') toggleRec();
});
</script>
</body>
